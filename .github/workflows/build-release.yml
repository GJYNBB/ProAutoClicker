name: Build And Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Generate Icon Assets
        run: python .\scripts\generate_icon.py

      - name: Build Package
        run: python -m PyInstaller --noconfirm --clean .\ProAutoClicker.spec

      - name: Archive Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\ProAutoClicker\* -DestinationPath .\dist\ProAutoClicker-windows.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProAutoClicker-windows
          path: |
            dist/ProAutoClicker
            dist/ProAutoClicker-windows.zip

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $content = Get-Content -Raw -Encoding UTF8 .\CHANGELOG.md
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\] - .*?(?=^## \[|\z)"
          $section = [regex]::Match($content, $pattern).Value.Trim()

          if ([string]::IsNullOrWhiteSpace($section)) {
            $section = @"
          ## [$version] - $(Get-Date -Format 'yyyy-MM-dd')

          ### 发布说明

          - 已自动生成 Windows 构建产物 `ProAutoClicker-windows.zip`
          - 详细变更请查看仓库中的 `CHANGELOG.md`
          "@.Trim()
          }

          Set-Content -Path .\release-notes.md -Value $section -Encoding UTF8

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProAutoClicker-windows.zip
          body_path: release-notes.md
