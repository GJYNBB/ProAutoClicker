name: Build And Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Generate Icon Assets
        run: python .\scripts\generate_icon.py

      - name: Build Package
        run: python -m PyInstaller --noconfirm --clean .\ProAutoClicker.spec

      - name: Archive Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\ProAutoClicker\* -DestinationPath .\dist\ProAutoClicker-windows.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProAutoClicker-windows
          path: |
            dist/ProAutoClicker
            dist/ProAutoClicker-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProAutoClicker-windows.zip
          generate_release_notes: true
